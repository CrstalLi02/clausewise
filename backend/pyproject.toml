[project]
name = "clausewise-backend"
version = "0.1.0"
description = "Clausewise · Cross-Department Document Processing and Q&A Assistant backend"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "motor>=3.4",
    "redis>=5.0",
    "pymongo>=4.6",
    "pypdf>=4.0",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "jieba>=0.42",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
vector = ["chromadb>=0.5"]
ocr = ["paddleocr>=2.7", "paddlepaddle>=2.6"]
local-embedding = ["sentence-transformers>=2.7"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
