apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clausewise.fullname" . }}-secret
  labels:
    {{- include "clausewise.labels" . | nindent 4 }}
type: Opaque
stringData:
  DEEPSEEK_API_KEY: {{ .Values.secrets.deepseekApiKey | quote }}
  RELAY_API_KEY: {{ .Values.secrets.relayApiKey | quote }}
  AUTH_SECRET: {{ .Values.secrets.authSecret | quote }}
  INTERNAL_API_TOKEN: {{ .Values.secrets.internalApiToken | quote }}
  MONGO_INITDB_ROOT_USERNAME: {{ .Values.secrets.mongoUser | quote }}
  MONGO_INITDB_ROOT_PASSWORD: {{ .Values.secrets.mongoPassword | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  MONGODB_URI: {{ .Values.secrets.mongodbUri | quote }}
  REDIS_ADDR: {{ .Values.secrets.redisAddr | quote }}
