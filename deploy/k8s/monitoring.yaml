# Observability: Prometheus scrape config + Grafana + Loki (simplified example)
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: clausewise
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'clausewise-backend'
        metrics_path: /metrics
        static_configs:
          - targets: ['backend.clausewise.svc.cluster.local:8000']
      - job_name: 'clausewise-dept-agents'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['clausewise']
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: dept-agent
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: '$1:8000'
          - source_labels: [__meta_kubernetes_pod_label_department]
            target_label: dept
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: clausewise
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.52.0
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: clausewise
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: clausewise
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.4.0
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: clausewise
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
