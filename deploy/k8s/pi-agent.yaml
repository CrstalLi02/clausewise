# pi agent service (Harness + Loop, Node/TS)
apiVersion: v1
kind: Service
metadata:
  name: pi-agent
  namespace: clausewise
spec:
  selector:
    app: pi-agent
  ports:
    - port: 8100
      targetPort: 8100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pi-agent
  namespace: clausewise
  labels:
    app: pi-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pi-agent
  template:
    metadata:
      labels:
        app: pi-agent
    spec:
      containers:
        - name: pi-agent
          image: clausewise-agent:pi-v1.0
          ports:
            - containerPort: 8100
          env:
            - name: PORT
              value: "8100"
            - name: BACKEND_URL
              value: "http://backend:8000"
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: clausewise-secrets
                  key: DEEPSEEK_API_KEY
            - name: RELAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: clausewise-secrets
                  key: RELAY_API_KEY
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: clausewise-secrets
                  key: INTERNAL_API_TOKEN
            - name: LOOP_PHASE
              value: "human_on_loop"
          readinessProbe:
            httpGet:
              path: /health
              port: 8100
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
